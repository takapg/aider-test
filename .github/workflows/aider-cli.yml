name: Aider CLI

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'AIに指示したい内容'
        required: true
        default: ''

jobs:
  aider-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # コードをチェックアウト
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Python環境のセットアップ
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Aiderのインストール
      - name: Install Aider
        run: |
          pip install aider-chat

      # Gitユーザーの設定
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # GroqをバックエンドにしてAiderを実行
      - name: Run AI Agent CLI via Groq
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          INSTRUCTION: ${{ github.event.inputs.instruction }}
        run: |
          echo "Executing instruction: $INSTRUCTION"

          aider --model openrouter/minimax/minimax-m2.5:free \
                --editor-model groq/meta-llama/llama-4-scout-17b-16e-instruct \
                --yes \
                --architect \
                --no-pretty \
                --message "$INSTRUCTION"

      # 変更されたコードをリポジトリにプッシュ
      - name: Push changes
        run: |
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
